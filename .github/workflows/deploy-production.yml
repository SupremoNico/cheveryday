name: Deploy Cheveryday to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent overlapping production deployments.
concurrency:
  group: cheveryday-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Check, Migrate and Deploy
    runs-on: ubuntu-latest

    # Prevent manual runs from deploying a non-main branch.
    if: github.ref == 'refs/heads/main'

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Run ESLint and TypeScript checks
      - name: Run code checks
        run: pnpm check

      # 6. Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 7. Pull production environment variables
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 8. Build production deployment
      - name: Build production deployment
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # 9. Run production database migrations
      - name: Run production database migrations
        run: pnpm db:migrate:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # 10. Deploy prebuilt application to Vercel
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
